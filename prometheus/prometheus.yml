global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # cAdvisor emits a very large surface. Keeping only what the dashboard
      # queries stops the retention window from filling with unread series.
      - source_labels: [__name__]
        regex: 'container_(cpu_usage_seconds_total|memory_working_set_bytes|fs_usage_bytes|network_(receive|transmit)_bytes_total|last_seen|spec_memory_limit_bytes)'
        action: keep

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
